name: Web

on:
  push:
    paths:
      - web/**
      - .github/workflows/web.yml
  pull_request:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/web.yml
  # Lets a deploy be re-run by hand, e.g. after changing a repository variable.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # On main, let a run finish so a deploy is never cut off partway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Publishes the site to GitHub Pages after a push to main passes the checks.
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A newer deploy waits for this one to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Repository variables (Settings → Secrets and variables → Actions),
          # built into the public page. Search stays disabled until
          # VITE_TERM_ID and VITE_MAPBOX_TOKEN are set.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_TERM_ID: ${{ vars.VITE_TERM_ID }}
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
