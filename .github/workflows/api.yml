name: API

on:
  push:
    paths:
      - api/**
      - .github/workflows/api.yml
  pull_request:
    branches: [main]
    paths:
      - api/**
      - .github/workflows/api.yml

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches docker-compose.yml's db service.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: get_a_room
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d get_a_room"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/get_a_room
      # Fail, don't skip, the DB-backed tests if Postgres isn't reachable.
      REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Migrations have a single head
        run: |
          alembic heads
          test "$(alembic heads | grep -c '(head)')" -eq 1

      - name: Migrations upgrade from an empty database
        run: alembic upgrade head

      - name: Migrations match the models
        run: alembic check

      - name: Migrations downgrade to base and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        # conftest.py creates and drops its own get_a_room_test database.
        run: pytest -q
