# Runs the whole stack: the API and its database (from ../api) plus the web
# app. Named, not taken from the folder, so the stack and its database volume
# keep the names they had when this was the get-a-room-web repo.
name: get-a-room-web

include:
  - ../api/docker-compose.yml

services:
  web:
    build: .
    environment:
      # The browser calls the API, so this is the API's address on the host,
      # not its address inside the Compose network.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      # The term to search. Set it in this directory's .env or the shell.
      VITE_TERM_ID: ${VITE_TERM_ID:-}
      # The campus map's Mapbox token. Search is disabled until it's set.
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      # Keep the image's node_modules rather than the host's, which may hold
      # binaries built for another platform.
      - /app/node_modules
    depends_on:
      - api
