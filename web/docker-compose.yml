# Runs the whole stack: the API and its database (from the sibling
# get-a-room-api checkout) plus the web app.
include:
  - ../get-a-room-api/docker-compose.yml

services:
  web:
    build: .
    environment:
      # The browser calls the API, so this is the API's address on the host,
      # not its address inside the Compose network.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      # Keep the image's node_modules rather than the host's, which may hold
      # binaries built for another platform.
      - /app/node_modules
    depends_on:
      - api
